name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@50.32.5 --ignore-scripts

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope invoicevista --token "$VERCEL_TOKEN"

      - name: Build production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --scope invoicevista --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --scope invoicevista --token "$VERCEL_TOKEN"

      - name: Verify the deployed commit
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          const expected = process.env.GITHUB_SHA;
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const response = await fetch(`https://lumasearch.vercel.app/build-info.json?commit=${expected}`, {
                cache: 'no-store',
                signal: AbortSignal.timeout(10000),
              });
              if (response.ok && (await response.json()).commit === expected) {
                console.log(`Verified https://lumasearch.vercel.app at ${expected}`);
                process.exit(0);
              }
            } catch {}
            await setTimeout(5000);
          }
          throw new Error(`Production did not serve commit ${expected}`);
          NODE
